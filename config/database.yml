# PostgreSQL, shared with the other app on the host: one role and four
# databases of our own on a server-wide instance, reached over the `internal`
# docker network. Production credentials arrive as environment variables, which
# is exactly what the host's provisioning script writes out.
#
# Four entries, not one. Solid Cache, Solid Queue and Solid Cable each keep
# their own schema (db/{cache,queue,cable}_schema.rb) and their own
# schema_migrations table, so pointing them at one shared database would make
# those three tables collide.
#
# The queue pool is set apart from RAILS_MAX_THREADS on purpose. Solid Queue
# runs inside Puma here and needs a connection per worker thread plus its
# dispatcher and scheduler — five, for the single 3-thread worker in
# config/queue.yml. Size the queue pool below that and the supervisor refuses to
# start, Puma notices it has gone and shuts down, and the container restarts
# forever: "Solid Queue is configured to use 5 threads but the database
# connection pool is 3". Web concurrency and job concurrency have no business
# being the same number, so they are no longer the same setting.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: lurepedia_development
  cache:
    <<: *default
    database: lurepedia_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    pool: <%= ENV.fetch("QUEUE_POOL") { 10 } %>
    database: lurepedia_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: lurepedia_development_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: lurepedia_test
  cache:
    <<: *default
    database: lurepedia_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    pool: <%= ENV.fetch("QUEUE_POOL") { 10 } %>
    database: lurepedia_test_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: lurepedia_test_cable
    migrations_paths: db/cable_migrate

production:
  primary: &production
    <<: *default
    database: <%= ENV["POSTGRES_DB"] %>
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
  cache:
    <<: *production
    database: <%= ENV["POSTGRES_DB_CACHE"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    pool: <%= ENV.fetch("QUEUE_POOL") { 10 } %>
    database: <%= ENV["POSTGRES_DB_QUEUE"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    database: <%= ENV["POSTGRES_DB_CABLE"] %>
    migrations_paths: db/cable_migrate
